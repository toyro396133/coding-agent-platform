name: CI — Biome, TypeScript & Design Audit

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🦋 Biome Format Check
        run: pnpm format:check

      - name: 🦋 Biome Lint
        run: pnpm lint:biome

      - name: 🔷 TypeScript Check
        run: pnpm type-check

      - name: 🎨 Design Audit — AI Slop Detection
        id: design-audit
        run: bash scripts/design-audit.sh --gh-annotation
        continue-on-error: true

      - name: 📝 Post Audit Summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const auditReport = '.github/design-audit-report.md';
            if (fs.existsSync(auditReport)) {
              const report = fs.readFileSync(auditReport, 'utf8');
              const { data: comment } = await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.payload.pull_request?.number,
                body: report,
              });
              console.log('Design audit comment posted');
            }

      - name: ✅ Status Check
        if: failure()
        run: |
          echo "❌ Some checks failed. Review the logs above."
          exit 1
